<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F1EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FIVE — 5×5 Log</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main navigation">
      <button class="tab" data-tab="home" aria-label="Home"></button>
      <button class="tab" data-tab="log" aria-label="Free log"></button>
      <button class="tab" data-tab="history" aria-label="History"></button>
      <button class="tab" data-tab="progress" aria-label="Progress"></button>
      <button class="tab" data-tab="settings" aria-label="Settings"></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
